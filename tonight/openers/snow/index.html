      g.globalAlpha=conB*.38;g.strokeStyle='rgba('+CHAP[E[2]].tint+',1)';
      g.beginPath();g.moveTo(a1.px,a1.py);g.lineTo(b1.px,b1.py);g.stroke();
    }
    g.globalAlpha=conB*.72;g.font='300 '+(11*(window.GJFX&&GJFX.val('txt')||100)/100).toFixed(1)+'px "Julius Sans One",Poppins,sans-serif';g.textAlign='center';g.textBaseline='middle';
    for(var c=0;c<CLU.length;c++){g.fillStyle='rgba('+CLU[c].tint+',1)';window.TN_NAV||g.fillText(CLU[c].k,CLU[c].x,CLU[c].y)}
  }
  if(lineB>.01){
    g.globalAlpha=lineB*.62;g.fillStyle='#f4f7fb';g.font=LINE.font;g.textAlign='center';g.textBaseline='middle';
    g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=8;
    LINE.lines.forEach(function(l,i){g.fillText(l,W/2,LINE.y0+i*LINE.lh)});
    g.shadowBlur=0;
  }
  /* LAYER A — foreground snow: in front of the photo, reflections and stars.
 Near-lens: larger, softer, slightly defocused, a little parallax. Falling only.
 As P increases, flakes fly into and settle at the mark/constellation star positions. */
  if(SNOW){
    var spK=(1-.5*pinchAct)*(1+.35*touchAct),R=Math.min(W,H)*.34;
    g.fillStyle='#e9f1ff';
    for(var i=0;i<FL.length;i++){
      var f=FL[i],z=f.z;
      if(!snowReleased(i,FL.length))continue;
      if(!f.on){f.on=1;f.age=0;f.vx=f.vy=0;f.x=rng2()*W;f.y=-12-rng2()*28}
      if(touchAct>.01){
        var dx=f.x-touchX,dy=f.y-touchY,rr=Math.hypot(dx,dy)+.001;
        if(rr<R){var w=Math.pow(1-rr/R,2)*touchAct*(.5+z*.6);f.vx+=(-dy/rr*180-dx/rr*40)*w*dt*6;f.vy+=(dx/rr*180-dy/rr*40)*w*dt*6}
      }
      f.vx*=Math.exp(-dt*1.7);f.vy*=Math.exp(-dt*1.7);
      f.x+=(f.vx+Math.sin(t*.00055*f.s+f.ph)*7*z)*dt;
      f.y+=(f.vy+(18+36*z)*spK)*dt;
      /* stronger radial parallax for nearer flakes when the passage zooms */
      if(Math.abs(zoomK)>.001){var zf=1+zoomK*dt*(1.15+z*1.8);f.x=cx+(f.x-cx)*zf;f.y=cy+(f.y-cy)*zf}
      f.age+=dt;
      if(merge<.85){
        if(f.y>H+20){f.y=-10;f.x=rng2()*W;f.vx=f.vy=0;f.age=0}
        if(f.x<-40)f.x=W+20;else if(f.x>W+40)f.x=-20;
      }
      var tw=.55+.45*Math.sin(t*.001*(f.tw||1)+f.ph);
      var snowA=(.18+.36*z)*Math.min(1.35,I)*tw*Math.min(1,f.age*.8);
      var tgt=PTS[f.tid];
      var dxs=f.x,dys=f.y,u=merge;
      if(tgt){
        dxs=lerp(f.x,tgt.px,u);
        dys=lerp(f.y,tgt.py,u);
      }
      var hold=1-sstep(.78,1,u);
      var a=snowA*hold+(tgt?(.5+.4*(tgt.b||.5))*u*hold:0);
      if(a<.02)continue;
      var rr2=lerp(f.r*(1+.2*touchAct), tgt?Math.max(1.2,1+tgt.b*1.6):1.4, u);
      var defo=lerp(1, .2, u)*(1.4+z*2.2);
      g.globalAlpha=Math.min(.92,a);
      var gs=rr2*defo*2.4;
      g.drawImage(GW,dxs-gs,dys-gs,gs*2,gs*2);
      if(u>.35){
        g.globalAlpha=Math.min(.95,a*u);
        g.fillStyle='#fff';g.beginPath();g.arc(dxs,dys,rr2,0,7);g.fill();
      }else{
        g.globalAlpha=Math.min(.7,a*.7);
        g.beginPath();g.arc(dxs,dys,Math.max(.8,rr2*.45),0,7);g.fill();
      }
    }
    /* near-lens bokeh stays in the foreground snow layer */
    var wantTouch=touchAct>.1&&now-lastTouchT<2500&&(ptrN>0||touchAct>.3);
    bokAcc+=dt*(wantTouch?(ptrN>0?7:5):0)+dt*(pinchAct>.1?2.2*pinchAct:0);
    if(bokAcc>1){
      bokAcc=0;
      if(pinchAct>.3&&ptrN!==1)spawnBokeh(cx,cy,Math.min(W,H)*.35,0,0,0,.6,2.1);
      else if(wantTouch)spawnBokeh(touchX,touchY,34,0,0,0,1.15,1.7);
    }
    g.save();g.globalCompositeOperation='lighter';
    for(var b=BOK.length-1;b>=0;b--){
      var o=BOK[b];o.t+=dt;var u=o.t/o.life;
      if(u>=1){BOK.splice(b,1);continue}
      o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(Math.abs(zoomK)>.001){var z2=1+zoomK*dt*2.6;o.x=cx+(o.x-cx)*z2;o.y=cy+(o.y-cy)*z2}
      var env=Math.sin(u*3.1416),dm=o.d*(.55+.9*u);
      g.globalAlpha=Math.min(.8,o.a*env*(SNOW?1:0)*(1-merge*.7));
      g.drawImage(BOKS,o.x-dm/2,o.y-dm/2,dm,dm);
    }
    g.restore();g.globalAlpha=1;
  }
  /* m4's tap glow */
  if(tapGlow){
    var age=(now-tapGlow.t)/1100;
    if(age>=1)tapGlow=null;else{
      var a2=(1-age)*(1-age)*.5;
      var rad=g.createRadialGradient(tapGlow.x,tapGlow.y,0,tapGlow.x,tapGlow.y,128);
      rad.addColorStop(0,'rgba(228,221,210,'+a2.toFixed(3)+')');rad.addColorStop(1,'rgba(228,221,210,0)');
      g.globalAlpha=1;g.fillStyle=rad;g.beginPath();g.arc(tapGlow.x,tapGlow.y,128,0,6.3);g.fill();
    }
  }
  g.globalAlpha=1;
}
