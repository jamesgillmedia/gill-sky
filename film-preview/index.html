<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Film · Horizon · ᑕᐣᓯ</title>
<meta name="theme-color" content="#04070b">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/horizon.css">
<link rel="stylesheet" href="css/case.css">
</head>
<body>
<header class="lab-top" id="top">
  <button type="button" class="lab-btn ic" id="back" aria-label="back one place" hidden>‹</button>
  <a class="sig" href="./" lang="cr" aria-label="Film">ᑕᐣᓯ</a>
  <span class="crumb ju"><b>film · </b><span id="where">horizon</span></span>
  <button type="button" class="lab-btn" id="sheetBtn" aria-pressed="false" aria-label="contact sheet">sheet</button>
</header>

<main class="sky fadein" id="sky" aria-label="horizon: drag sideways to move through the films, in the film list order" tabindex="0">
  <div class="water" id="water"></div>
  <div class="refl" id="refl" aria-hidden="true"></div>
  <div class="frames" id="frames"></div>
  <div class="head" aria-hidden="true"></div>
  <div class="ends"><span></span><span id="now"></span><span></span></div>
</main>

<section class="sheet" id="sheet" aria-label="contact sheet: every film, numbered, in the same order as the horizon" hidden>
  <div class="sc" id="sc">
    <div class="proof" id="proof">
      <div class="phd"><span class="ju" id="phd"></span><span>in the film list order</span></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</section>

<section class="hall" id="hall" aria-label="film in a wireframe box" hidden>
  <div class="stage" id="stage">
    <div class="cases" id="cases"></div>
  </div>
  <div class="chud" id="chud">
    <button type="button" id="up" aria-label="up one layer">‹ Back</button>
    <button type="button" id="sheetFromCase" aria-label="contact sheet">sheet</button>
    <span class="sp"></span>
    <button type="button" id="board">board ›</button>
    <button type="button" id="home">Home</button>
  </div>
  <div class="clabel" id="clabel" role="status" aria-live="polite"><span class="t"></span><span class="n">whole piece</span></div>
  <button type="button" class="sidebtn" id="prevC" aria-label="previous film">‹</button>
  <button type="button" class="sidebtn" id="nextC" aria-label="next film">›</button>
  <button type="button" id="inb" aria-label="open this film">in ›</button>
</section>

<section class="day" id="day" aria-label="the film" hidden>
  <div class="dsc" id="dsc">
    <figure class="hero" id="hero"></figure>
    <div class="cred" id="cred"></div>
    <p class="end ju" id="dayBack">back ‹</p>
  </div>
</section>

<div class="veil"></div>
<script src="js/films.js"></script>
<script src="js/app.js"></script>
</body>
</html>
